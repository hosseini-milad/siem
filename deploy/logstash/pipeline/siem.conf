input {
  http {
    host => "0.0.0.0"
    port => 8080
    codec => json
    ecs_compatibility => disabled
    response_code => 202
  }
}
filter {
  ruby {
    code => 'event.set("siem_body", LogStash::Json.dump({"batch_id" => event.get("batch_id"), "events" => event.get("events")}))'
  }
}
output {
  http {
    url => "${SIEM_API_URL:http://backend:8000/api/v1/ingestion/logstash}"
    http_method => "post"
    format => "message"
    message => "%{siem_body}"
    content_type => "application/json"
    retry_failed => true
    retryable_codes => [429, 500, 502, 503, 504]
    automatic_retries => 1
  }
}
