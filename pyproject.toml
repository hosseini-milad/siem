[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "siem-backend"
version = "0.1.0"
description = "SIEM log ingestion API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pymongo>=4.11,<5", "pydantic-settings>=2.7,<3", "lightgbm>=4.6,<5", "catboost>=1.2.8,<2", "scikit-learn>=1.7,<2", "numpy>=2.3,<3", "scipy>=1.16,<2", "orjson>=3.11,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
